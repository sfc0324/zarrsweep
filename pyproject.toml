[project]
name = "zarrsweep"
version = "0.2.0"
description = "Listing-only integrity sweep of OME-Zarr stores in the Vesuvius Challenge open-data bucket"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "requests>=2.28"]

[project.optional-dependencies]
test = ["pytest>=7", "numcodecs>=0.12"]
verify = ["numcodecs>=0.12"]

[project.scripts]
zarrsweep = "zarrsweep.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["zarrsweep"]
